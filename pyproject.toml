[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aiba-agent"
version = "1.4.0"
description = "Self-hosted, security-first autonomous AI agent runtime"
requires-python = ">=3.11"
dependencies = ["cryptography>=50.0.0,<51.0"]
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0"]
browser = ["playwright>=1.40"]
desktop = ["pyautogui>=0.9.54", "pillow>=10.0"]
bedrock = ["boto3>=1.34"]
all = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.0", "playwright>=1.40", "pyautogui>=0.9.54", "pillow>=10.0", "boto3>=1.34"]
[tool.setuptools]
py-modules = ["main"]
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "agent_system*"]
[project.scripts]
aiba = "main:main"
