name: Production Gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.11','3.12','3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: python -m pip install -e .[api]
      - if: runner.os == 'Windows'
        shell: pwsh
        run: $env:AIBA_INSTALL_NO_LAUNCH='true'; .\installers\windows\install.ps1
      - if: runner.os == 'macOS'
        run: AIBA_INSTALL_NO_LAUNCH=true bash installers/macos/install.sh
      - if: runner.os == 'Linux'
        run: AIBA_INSTALL_NO_LAUNCH=true bash install-linux.sh
      - run: python scripts/certify_install.py
      - run: python tests/api_smoke.py
      - uses: actions/upload-artifact@v4
        with: {name: 'certification-${{ matrix.os }}-${{ matrix.python }}', path: certification/*.json}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -e .[api] pip-audit bandit
      - run: python -m pip_audit --strict -r requirements.txt
      - run: bandit -q -lll -r . -x ./tests
      - run: python scripts/secret_scan.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aiba-agent:gate .
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {image-ref: 'aiba-agent:gate', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}
      - name: Run container diagnostics with ephemeral test secrets
        run: |
          AIBA_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          AIBA_MASTER_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run --rm \
            -e AIBA_API_TOKEN="$AIBA_API_TOKEN" \
            -e AIBA_MASTER_KEY="$AIBA_MASTER_KEY" \
            aiba-agent:gate python aiba_launcher.py --doctor
