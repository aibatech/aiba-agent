name: Real semantic memory evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/semantic-memory.yml'
      - 'scripts/prepare_memory_model.py'
      - 'scripts/evaluate_memory.py'
      - 'benchmarks/memory/**'
      - 'memory/semantic.py'
      - 'memory/retrieval.py'
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[semantic]'
      - run: python scripts/prepare_memory_model.py --destination /tmp/aiba-evaluation-model
      - run: python scripts/evaluate_memory.py --model /tmp/aiba-evaluation-model --output certification/semantic-memory-v1.json
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-memory-evidence
          path: certification/semantic-memory-v1.json
