name: Isolated Runtime Soak
on:
  workflow_dispatch:
  push:
    branches: [hardening/mission-acceptance-gates]
    paths:
      - scripts/certify_runtime.py
      - tests/load_test.py
      - .github/workflows/runtime-soak.yml
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[api]'
      - name: One-hour isolated HTTP soak with RSS sampling
        run: python scripts/certify_runtime.py --soak-seconds 3600 --output certification/runtime-soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-soak-evidence
          path: certification/runtime-soak.json
